services:
  - type: web
    name: ooda-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: ./data/ooda.sqlite
      - key: ALLOW_REGISTRATION
        value: true
      - key: AI_PROVIDER
        value: openrouter_free
      - key: AI_WORKFLOW
        value: single
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: OPENROUTER_API_KEY
        sync: false
